services:
  db:
    image: postgres:17-alpine
    container_name: ffz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ffz_platform
      POSTGRES_USER: ffz
      POSTGRES_PASSWORD: ffz_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ffz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffz -d ffz_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ffz_postgres_data:
