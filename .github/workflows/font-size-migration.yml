name: FFZ One-off Font Size Migration

on:
  push:
    branches:
      - feature/weekly-review-v1

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/weekly-review-v1

      - name: Apply +2px font migration
        run: node scripts/increase-font-sizes.mjs

      - name: Commit migrated CSS
        shell: bash
        run: |
          if git diff --quiet && [ ! -f .ffz-font-size-offset-applied ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .ffz-font-size-offset-applied
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "Increase application font sizes by two pixels [skip ci]"
          git push origin HEAD:feature/weekly-review-v1
