server {
    listen 80;
    listen [::]:80;
    server_name ffz.app www.ffz.app;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ffz.app www.ffz.app;
    server_tokens off;
    client_max_body_size 45m;

    ssl_certificate /etc/letsencrypt/live/ffz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffz.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FFZSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ffz_upstream ffz-app:3000;

    location / {
        proxy_pass http://$ffz_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
