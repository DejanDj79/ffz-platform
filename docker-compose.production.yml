name: ffz-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ffz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FFZ_UPLOAD_DIR: /app/data/uploads
      AUTH_RATE_LIMIT_SALT: ${AUTH_RATE_LIMIT_SALT}
      FFZ_APP_URL: ${FFZ_APP_URL:-}
      FFZ_PUBLIC_REVIEW_MODE: ${FFZ_PUBLIC_REVIEW_MODE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NEXT_PUBLIC_FASTSPRING_STOREFRONT: ${NEXT_PUBLIC_FASTSPRING_STOREFRONT:-}
      FASTSPRING_PRO_MONTHLY_PATH: ${FASTSPRING_PRO_MONTHLY_PATH:-pro-monthly}
      FASTSPRING_PRO_YEARLY_PATH: ${FASTSPRING_PRO_YEARLY_PATH:-pro-yearly}
      FASTSPRING_FOUNDER_PATH: ${FASTSPRING_FOUNDER_PATH:-founder-trader}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_MONTHLY_PRICE_ID: ${PADDLE_MONTHLY_PRICE_ID:-}
      PADDLE_ANNUAL_PRICE_ID: ${PADDLE_ANNUAL_PRICE_ID:-}
      PADDLE_FOUNDER_PRICE_ID: ${PADDLE_FOUNDER_PRICE_ID:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-production}
    volumes:
      - ffz_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        aliases:
          - ffz-app
      backend:

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    profiles:
      - ops
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command:
      ["./node_modules/.bin/drizzle-kit", "migrate", "--config=drizzle.production.config.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  demo-reset:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    profiles:
      - ops
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FFZ_UPLOAD_DIR: /app/data/uploads
    volumes:
      - ffz_uploads:/app/data/uploads
    entrypoint: ["./node_modules/.bin/tsx", "src/db/reset-demo-user.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  backup-helper:
    image: alpine:3.21
    profiles:
      - ops
    volumes:
      - ffz_uploads:/uploads
    command: ["true"]

networks:
  proxy:
    external: true
    name: ${FFZ_PROXY_NETWORK:-agarviz_default}
  backend:
    driver: bridge
    internal: true

volumes:
  ffz_postgres_data:
  ffz_uploads:
